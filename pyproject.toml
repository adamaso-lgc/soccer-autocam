[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-autocam"
version = "0.1.0"
description = "Digital PTZ camera that follows the ball in soccer matches and streams to YouTube"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python>=4.9", "ultralytics>=8.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autocam = "autocam.__main__:main"

[tool.setuptools]
packages = ["autocam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
